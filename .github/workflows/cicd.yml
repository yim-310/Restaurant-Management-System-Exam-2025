
name: RMS Newman E2E Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  newman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Run Newman E2E Tests
        run: >
          npx newman run
          ./tests/postman/RMS-68030310-TestSuite.postman_collection.json
          -e ./tests/postman/env.json
          --reporters cli


      - name: Run Newman E2E Tests
        run: >
          npx newman run
          ./tests/postman/RMS-68030310-TestSuite.postman_collection.json
          -e ./tests/postman/env.json
          --reporters cli
